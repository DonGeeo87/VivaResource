services:
  vivaresource-db:
    image: postgres:16-alpine
    container_name: vivaresource-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=vivaresource
      - POSTGRES_PASSWORD=${PGPASSWORD}
      - POSTGRES_DB=vivaresource_blog
    volumes:
      - vivaresource_pgdata:/var/lib/postgresql/data
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vivaresource -d vivaresource_blog"]
      interval: 10s
      timeout: 5s
      retries: 5

  vivaresource:
    build:
      context: .
      args:
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: vivaresource
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${NEXT_PUBLIC_PAYPAL_CLIENT_ID}
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
    container_name: vivaresource
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--openssl-legacy-provider
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=vivaresource
      - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID}
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
      - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - NEXT_PUBLIC_PAYPAL_CLIENT_ID=${NEXT_PUBLIC_PAYPAL_CLIENT_ID}
      - NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}
      - NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_APP_PASSWORD=${EMAIL_APP_PASSWORD}
      - NEWSLETTER_ADMIN_EMAILS=${NEWSLETTER_ADMIN_EMAILS}
      - FIREBASE_ADMIN_KEY=${FIREBASE_ADMIN_KEY}
      - REPORT_SECRET=${REPORT_SECRET}
      - PGHOST=vivaresource-db
      - PGPORT=5432
      - PGDATABASE=vivaresource_blog
      - PGUSER=vivaresource
      - PGPASSWORD=${PGPASSWORD}
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true

volumes:
  vivaresource_pgdata: