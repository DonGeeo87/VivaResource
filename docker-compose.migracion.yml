services:
  viva-migracion-db:
    image: postgres:16-alpine
    container_name: viva-migracion-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=vivaresource
      - POSTGRES_PASSWORD=${PGPASSWORD}
      - POSTGRES_DB=vivaresource_blog
    volumes:
      - viva_migracion_pgdata:/var/lib/postgresql/data
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vivaresource -d vivaresource_blog"]
      interval: 10s
      timeout: 5s
      retries: 5

  viva-migracion:
    build:
      context: .
      args:
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: vivaresource
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_SITE_URL: https://viva.codigoguerrero.dev
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${NEXT_PUBLIC_PAYPAL_CLIENT_ID}
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
    container_name: viva-migracion
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--openssl-legacy-provider
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=vivaresource
      - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID}
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
      - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
      - NEXT_PUBLIC_SITE_URL=https://viva.codigoguerrero.dev
      - NEXT_PUBLIC_PAYPAL_CLIENT_ID=${NEXT_PUBLIC_PAYPAL_CLIENT_ID}
      - NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}
      - NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=${NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_APP_PASSWORD=${EMAIL_APP_PASSWORD}
      - NEWSLETTER_ADMIN_EMAILS=${NEWSLETTER_ADMIN_EMAILS}
      - FIREBASE_ADMIN_KEY=${FIREBASE_ADMIN_KEY}
      - REPORT_SECRET=${REPORT_SECRET}
      - PGHOST=viva-migracion-db
      - PGPORT=5432
      - PGDATABASE=vivaresource_blog
      - PGUSER=vivaresource
      - PGPASSWORD=${PGPASSWORD}
    networks:
      - proxy-network
    depends_on:
      viva-migracion-db:
        condition: service_healthy

networks:
  proxy-network:
    external: true

volumes:
  viva_migracion_pgdata:
